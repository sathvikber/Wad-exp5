<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Catalog</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      min-height: 100vh;
      padding: 30px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { text-align: center; color: #333; }
    .controls {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
      align-items: center;
    }
    select, input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 1em;
    }
    button {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
    .avg-box {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      text-align: center;
      font-size: 1.1em;
      margin-bottom: 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); }
    .card h3 { color: #333; margin-bottom: 8px; }
    .card .price { color: #27ae60; font-size: 1.3em; font-weight: bold; }
    .card .category {
      background: #e8f8f5;
      color: #11998e;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.85em;
      margin: 8px 0;
      display: inline-block;
    }
    .card .rating { color: #f39c12; font-size: 1.1em; }
    .form-section {
      margin-top: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 10px;
    }
    .form-section h2 { margin-bottom: 15px; color: #333; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-row input { flex: 1; min-width: 150px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛍️ Product Catalog</h1>

    <div class="avg-box" id="avgRating">Loading average rating...</div>

    <div class="controls">
      <select id="categoryFilter" onchange="renderCards()">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Furniture">Furniture</option>
        <option value="Stationery">Stationery</option>
      </select>
    </div>

    <div class="cards" id="cardsContainer"></div>

    <div class="form-section">
      <h2>➕ Add New Product</h2>
      <div class="form-row">
        <input type="text" id="newName" placeholder="Product Name">
        <input type="number" id="newPrice" placeholder="Price (₹)">
        <input type="text" id="newCategory" placeholder="Category">
        <input type="number" id="newRating" placeholder="Rating (0-5)" step="0.1" min="0" max="5">
        <button onclick="addProduct()">Add Product</button>
      </div>
    </div>
  </div>

  <script>
    let products = [
      { product_id: 1, product_name: "Laptop", price: 55000, category: "Electronics", rating: 4.5 },
      { product_id: 2, product_name: "Headphones", price: 2500, category: "Electronics", rating: 4.2 },
      { product_id: 3, product_name: "Desk Chair", price: 8000, category: "Furniture", rating: 3.8 },
      { product_id: 4, product_name: "Notebook", price: 150, category: "Stationery", rating: 4.0 },
      { product_id: 5, product_name: "Bookshelf", price: 4500, category: "Furniture", rating: 4.3 }
    ];

    function renderCards() {
      const filter = document.getElementById("categoryFilter").value;
      const filtered = filter === "All" ? products : products.filter(p => p.category === filter);
      const container = document.getElementById("cardsContainer");
      container.innerHTML = "";
      filtered.forEach(p => {
        const stars = "⭐".repeat(Math.round(p.rating));
        container.innerHTML += `
          <div class="card">
            <h3>${p.product_name}</h3>
            <div class="price">₹${p.price.toLocaleString()}</div>
            <div class="category">${p.category}</div>
            <div class="rating">${stars} (${p.rating})</div>
          </div>`;
      });

      const avg = (products.reduce((a, b) => a + b.rating, 0) / products.length).toFixed(2);
      document.getElementById("avgRating").textContent = `⭐ Average Rating of All Products: ${avg} / 5`;
    }

    function addProduct() {
      const name = document.getElementById("newName").value.trim();
      const price = parseFloat(document.getElementById("newPrice").value);
      const category = document.getElementById("newCategory").value.trim();
      const rating = parseFloat(document.getElementById("newRating").value);

      if (!name || isNaN(price) || !category || isNaN(rating)) {
        alert("Please fill in all fields correctly!");
        return;
      }

      products.push({
        product_id: products.length + 1,
        product_name: name,
        price, category, rating
      });

      document.getElementById("newName").value = "";
      document.getElementById("newPrice").value = "";
      document.getElementById("newCategory").value = "";
      document.getElementById("newRating").value = "";

      renderCards();
    }

    renderCards();
  </script>
</body>
</html>
